<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>상품 목록</h1>
<div th:if="${#lists.isEmpty(products)}">
    <p>등록된 상품이 없습니다. 관리자 페이지에서 상품을 등록해 주세요.</p>
</div>
<ul>
    <li th:each="product : ${products}">
        <a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}">상품명</a>
        - <span th:text="${product.price} + '원'">가격</span>
    </li>
</ul>
</body>
</html>
