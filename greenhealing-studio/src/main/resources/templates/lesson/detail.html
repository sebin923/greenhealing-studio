<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${classItem.title}">클래스 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .detail-wrap { display:flex; flex-wrap:wrap; gap:50px; padding:36px 6% 60px; }
        .detail-wrap .thumb { width:420px; max-width:100%; height:320px; flex-shrink:0; border-radius:6px;
            background: radial-gradient(circle at 30% 30%, #E7EFD8, #B9CE9C 70%); }
        .info { flex:1 1 320px; min-width:0; padding-top:8px; }
        .info .studio { font-size:12px; color:#7FAE72; margin-bottom:8px; }
        .info h1 { font-family:Georgia,serif; font-size:26px; margin-bottom:16px; }
        .info .row { display:flex; justify-content:space-between; font-size:13px; color:#4b5847; padding:10px 0; border-bottom:1px solid #EFEBDE; }
        .price { font-size:20px; margin:18px 0; }
        .reserve-btn, .cancel-btn { width:100%; padding:15px 0; border-radius:8px; font-size:14px; letter-spacing:1px;
            border:none; cursor:pointer; }
        .reserve-btn { background:#233420; color:#f4f1e8; }
        .reserve-btn:disabled { background:#B8C2AA; cursor:not-allowed; }
        .cancel-btn { background:#fff; color:#b5482e; border:1.5px solid #e0c4bd; }
        .msg { font-size:13px; margin-bottom:16px; padding:10px 14px; border-radius:6px; }
        .msg.ok { background:#E7EFD8; color:#3d6b34; }
        .msg.err { background:#FBEAE6; color:#b5482e; }
    </style>
</head>
<body style="padding:0;">
<nav th:replace="~{common/fragments :: nav(active='classes')}"></nav>

<div class="detail-wrap">
    <div class="thumb"></div>
    <div class="info">
        <div class="studio" th:text="${classItem.studio.name}">공방명</div>
        <h1 th:text="${classItem.title}">클래스명</h1>

        <!-- 예약/취소 처리 후 redirect로 돌아오면서 붙여준 쿼리파라미터(?reserved=success, ?error=...)를
             화면에 성공/실패 메시지로 보여줌 -->
        <p class="msg ok" th:if="${param.reserved}">예약이 완료되었습니다.</p>
        <p class="msg err" th:if="${param.error}" th:text="${param.error}">에러</p>

        <div class="row"><span>일시</span>
            <span th:text="${#temporals.format(classItem.classDate, 'yyyy.MM.dd (E)')} + ' ' + ${classItem.startTime} + ' ~ ' + ${classItem.endTime}">일시</span></div>
        <div class="row"><span>정원</span>
            <span th:text="${classItem.reservedCount} + ' / ' + ${classItem.capacity} + '명'">정원</span></div>

        <div class="price" th:text="'₩ ' + ${#numbers.formatInteger(classItem.price, 0, 'COMMA')}">가격</div>

        <!-- 로그인 상태에 따라, 그리고 이미 예약했는지에 따라 버튼 3가지 경우로 나뉨 -->

        <!-- 1) 로그인 O + 이미 예약함 -> 취소 버튼 -->
        <form th:if="${myReservation != null}" th:action="@{'/reservations/' + ${myReservation.id} + '/cancel'}" method="post">
            <button type="submit" class="cancel-btn">예약 취소하기</button>
        </form>

        <!-- 2) 로그인 O + 아직 예약 안 함 + 정원 남음 -> 예약 버튼 -->
        <form th:if="${myReservation == null and classItem.reservedCount < classItem.capacity}"
              sec:authorize="isAuthenticated()" th:action="@{/reservations}" method="post">
            <input type="hidden" name="classScheduleId" th:value="${classItem.id}">
            <button type="submit" class="reserve-btn">예약하기</button>
        </form>

        <!-- 3) 정원이 다 참 -->
        <button th:if="${classItem.reservedCount >= classItem.capacity}" class="reserve-btn" disabled>예약 마감</button>

        <!-- 4) 로그인 안 한 사람 (정원이 남아있을 때만 "로그인 후 예약하기" 유도) -->
        <a th:if="${classItem.reservedCount < classItem.capacity}" sec:authorize="isAnonymous()"
           th:href="@{/login}" class="reserve-btn" style="display:block; text-align:center; text-decoration:none;">로그인 후 예약하기</a>
    </div>
</div>
<footer th:replace="~{common/fragments :: footer}"></footer>
</body>
</html>
