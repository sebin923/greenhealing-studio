<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="padding:0;">
<div class="auth-wrap">
    <a class="auth-header" th:href="@{/}" style="text-decoration:none; color:inherit;">GREEN HEALING STUDIO</a>
    <div class="auth-stage">
        <div class="auth-blob"></div>
        <div class="auth-card">
            <h1>비밀번호 재설정</h1>

            <div th:if="${!valid}">
                <p class="error-box" th:text="${error} ?: '유효하지 않거나 만료된 링크입니다.'"></p>
                <p class="auth-foot"><a th:href="@{/password-reset}">다시 요청하기</a></p>
            </div>

            <form th:if="${valid}" th:action="@{/password-reset/confirm}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="field">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" required minlength="8">
                </div>
                <button type="submit" class="auth-submit">비밀번호 변경</button>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{common/fragments :: footer-simple}"></footer>
</body>
</html>
