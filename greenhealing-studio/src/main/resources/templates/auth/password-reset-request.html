<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="padding:0;">
<div class="auth-wrap">
    <a class="auth-header" th:href="@{/}" style="text-decoration:none; color:inherit;">GREEN HEALING STUDIO</a>
    <div class="auth-stage">
        <div class="auth-blob"></div>
        <div class="auth-card">
            <h1>비밀번호 찾기</h1>
            <p class="sub">가입하신 이메일로 재설정 링크를 보내드려요</p>

            <p class="success-box" th:if="${message}" th:text="${message}"></p>

            <form th:action="@{/password-reset}" method="post">
                <div class="field">
                    <label>이메일</label>
                    <input type="email" name="email" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="auth-submit">재설정 링크 받기</button>
            </form>
            <p class="auth-foot"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
        </div>
    </div>
</div>
<footer th:replace="~{common/fragments :: footer-simple}"></footer>
</body>
</html>
