<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리 - 플랫폼 관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .admin-shell { display:flex; }
        .admin-side { width:220px; background:#1F4E79; color:#f4f1e8; min-height:100vh; padding:34px 0; }
        .admin-side .logo { font-family:Georgia,serif; font-size:16px; padding:0 28px 30px; }
        .admin-side .item { display:block; padding:14px 28px; font-size:13px; color:#cdd9e6; text-decoration:none; }
        .admin-side .item.on { background:#2c6294; color:#fff; font-weight:bold; }
        .admin-main { flex:1; padding:36px 40px; }
        .admin-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .admin-top h1 { font-family:Georgia,serif; font-size:22px; }
        .new-btn { background:#1F4E79; color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:13px; }

        table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #E4E0D3; border-radius:10px; overflow:hidden; }
        th { text-align:left; font-size:11px; color:#8b9382; padding:14px 18px; background:#F4F1E8; }
        td { font-size:13px; padding:14px 18px; border-top:1px solid #EFEBDE; }
        .row-actions a, .row-actions button {
            font-size:12px; padding:6px 12px; border-radius:6px; border:1px solid #D8D2C0;
            background:#fff; color:#4b5847; text-decoration:none; cursor:pointer; margin-right:6px;
        }
        .row-actions button.danger { color:#b5482e; border-color:#e0c4bd; }
        .empty-note { text-align:center; padding:60px 0; color:#7a8371; }
    </style>
</head>
<body style="padding:0;">
<div class="admin-shell">
    <div class="admin-side">
        <div class="logo">GREEN HEALING<br>플랫폼 관리자</div>
        <a class="item" th:href="@{/platform-admin/studios}">공방 관리</a>
        <a class="item" th:href="@{/platform-admin/members}">회원 관리</a>
        <a class="item on" th:href="@{/platform-admin/notices}">공지사항 관리</a>
        <a class="item" th:href="@{/platform-admin}">← 관리자 홈</a>
        <a class="item" th:href="@{/logout}" style="margin-top:20px; border-top:1px solid rgba(244,241,232,.15); padding-top:20px;">로그아웃</a>
    </div>
    <div class="admin-main">
        <div class="admin-top">
            <h1>공지사항 관리</h1>
            <a class="new-btn" th:href="@{/platform-admin/notices/new}">+ 공지 작성</a>
        </div>

        <p class="empty-note" th:if="${#lists.isEmpty(notices)}">작성된 공지사항이 없습니다.</p>

        <table th:if="${not #lists.isEmpty(notices)}">
            <tr><th>제목</th><th>작성일</th><th>관리</th></tr>
            <tr th:each="n : ${notices}">
                <td th:text="${n.title}">제목</td>
                <td th:text="${#temporals.format(n.createdAt, 'yyyy.MM.dd')}">작성일</td>
                <td class="row-actions">
                    <a th:href="@{'/platform-admin/notices/' + ${n.id} + '/edit'}">수정</a>
                    <form th:action="@{'/platform-admin/notices/' + ${n.id} + '/delete'}" method="post" style="display:inline;"
                          onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit" class="danger">삭제</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
