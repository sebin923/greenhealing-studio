<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>플랫폼 관리자 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .admin-shell { display:flex; }
        .admin-side { width:220px; background:#1F4E79; color:#f4f1e8; min-height:100vh; padding:34px 0; }
        .admin-side .logo { font-family:Georgia,serif; font-size:16px; padding:0 28px 30px; }
        .admin-side .item { padding:14px 28px; font-size:13px; color:#cdd9e6; }
        .admin-main { flex:1; padding:36px 40px; }
        .admin-main h1 { font-family:Georgia,serif; font-size:22px; margin-bottom:10px; }
        .admin-main p { font-size:13px; color:#7a8371; margin-bottom:30px; }
        .todo-list { background:#fff; border:1px solid #E4E0D3; border-radius:10px; padding:24px; max-width:520px; }
        .todo-list li { font-size:13px; color:#4b5847; padding:8px 0; border-bottom:1px solid #EFEBDE; }
    </style>
</head>
<body style="padding:0;">
<div class="admin-shell">
    <div class="admin-side">
        <div class="logo">GREEN HEALING<br>플랫폼 관리자</div>
        <div class="item">공방 입점 승인</div>
        <div class="item">공방 관리</div>
        <div class="item">전체 회원 관리</div>
        <div class="item">공지사항 관리</div>
        <div class="item">약관·개인정보처리방침</div>
        <div class="item">방문자 통계</div>
        <div class="item" style="margin-top:20px; border-top:1px solid rgba(244,241,232,.15); padding-top:20px;">
            <a th:href="@{/logout}" style="color:#cdd9e6;">로그아웃</a>
        </div>
    </div>
    <div class="admin-main">
        <h1 th:text="${loginUserName} + ' 님, 안녕하세요'">플랫폼 관리자님, 안녕하세요</h1>
        <p>플랫폼 관리자 전용 화면입니다. 아래 기능은 순차적으로 구현될 예정입니다.</p>
        <ul class="todo-list">
            <li>공방 입점 신청 확인·승인·거절</li>
            <li>입점 공방 목록 관리</li>
            <li>전체 회원 목록·검색·정지·삭제</li>
            <li>공지사항 작성·수정·삭제</li>
            <li>이용약관 / 개인정보처리방침 수정</li>
            <li>방문자 통계 (일/주/월별)</li>
        </ul>
    </div>
</div>
</body>
</html>
