<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문제작 신청 내역 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .co-wrap { padding: 36px 6% 80px; max-width: 800px; }
        .success-box { background:#E7EFD8; color:#3d6b34; font-size:13px; padding:12px 16px; border-radius:6px; margin-bottom:20px; }
        .co-row { padding:18px 4px; border-bottom:1px solid #E4E0D3; }
        .co-row .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .co-row .studio { font-size:11px; color:#7FAE72; }
        .co-row .meta { font-size:12px; color:#7a8371; margin-top:4px; }
        .co-row .note { font-size:13px; color:#4b5847; margin-top:8px; }
        .status { font-size:11px; padding:4px 12px; border-radius:999px; }
        .status.PENDING { background:#F1DCC9; color:#8A4A24; }
        .status.QUOTED { background:#EAE6F2; color:#5b4b8a; }
        .status.IN_PROGRESS { background:#DCE7F0; color:#2c5f8a; }
        .status.COMPLETED { background:#E7EFD8; color:#3d6b34; }
        .status.REJECTED { background:#F1EDE3; color:#B8B2A0; }
        .quoted-price { font-size:13px; font-weight:bold; color:#233420; margin-top:6px; }
    </style>
</head>
<body style="padding:0;">
<nav th:replace="~{common/fragments :: nav(active='')}"></nav>

<div class="co-wrap">
    <h1 style="font-family:Georgia,serif; font-size:24px; margin-bottom:24px;">주문제작 신청 내역</h1>

    <p class="success-box" th:if="${param.submitted}">주문제작 신청이 완료되었습니다. 공방에서 검토 후 견적을 안내해 드립니다.</p>

    <div th:if="${#lists.isEmpty(customOrders)}" style="padding:60px 0; text-align:center; color:#7a8371;">
        신청 내역이 없습니다. <a th:href="@{/custom-order}" style="color:#233420;">주문제작 신청하러 가기 →</a>
    </div>

    <div class="co-row" th:each="co : ${customOrders}">
        <div class="top">
            <div>
                <div class="studio" th:text="${co.studio.name}">공방명</div>
                <div th:text="${co.size} + (${co.color} != null ? (' · ' + ${co.color}) : '')">사이즈·색상</div>
            </div>
            <span class="status" th:classappend="${co.status.name()}" th:text="${co.status.name()}">상태</span>
        </div>
        <div class="note" th:if="${co.requestNote}" th:text="${co.requestNote}">요청사항</div>
        <div class="quoted-price" th:if="${co.quotedPrice != null}"
             th:text="'견적: ₩ ' + ${#numbers.formatInteger(co.quotedPrice, 0, 'COMMA')}">견적</div>
        <div class="meta" th:text="${#temporals.format(co.createdAt, 'yyyy.MM.dd')} + ' 신청'">신청일</div>
    </div>
</div>

<footer th:replace="~{common/fragments :: footer}"></footer>
</body>
</html>
