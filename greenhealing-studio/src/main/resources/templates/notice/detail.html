<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${notice.title}">공지사항</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .notice-detail { padding: 36px 6% 80px; max-width: 800px; }
        .notice-detail h1 { font-family:Georgia,serif; font-size:22px; margin-bottom:8px; }
        .notice-detail .date { font-size:12px; color:#8b9382; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #E4E0D3; }
        .notice-detail .body { font-size:14px; line-height:1.9; color:#4b5847; white-space:pre-line; }
        .back-link { display:inline-block; margin-top:32px; font-size:13px; color:#7a8371; text-decoration:none; }
    </style>
</head>
<body style="padding:0;">
<nav th:replace="~{common/fragments :: nav(active='')}"></nav>

<div class="notice-detail">
    <h1 th:text="${notice.title}">공지 제목</h1>
    <div class="date" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">날짜</div>
    <div class="body" th:text="${notice.content}">공지 내용</div>
    <a class="back-link" th:href="@{/notice}">← 목록으로</a>
</div>

<footer th:replace="~{common/fragments :: footer}"></footer>
</body>
</html>
