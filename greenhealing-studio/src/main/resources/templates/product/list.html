<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="padding:0;">
<nav class="site-nav">
    <!-- 주의: 여기 있는 @{/} , @{/products} 는 "URL 주소" 라서
         파일이 templates/products/list.html 이든 templates/product/list.html 이든
         절대 안 바뀌어. 헷갈리기 쉬운 부분이라 남겨둠. -->
    <a class="logo" th:href="@{/}">Green Healing Studio</a>
    <div class="menu"><a th:href="@{/}">홈</a><a th:href="@{/products}" class="active">상품</a></div>
    <div class="icons"><a th:href="@{/login}">로그인</a></div>
</nav>

<div style="padding: 36px 6% 10px;">
    <h1 style="font-family:Georgia,serif; font-size:26px; margin-bottom:20px;">상품 목록</h1>

    <!-- ===== 검색·필터 폼 =====
         method="get" 이라서 검색하면 주소창이
         /products?keyword=러그&category=완제품 이런 식으로 바뀜.
         ProductController.list() 가 이 keyword/category 파라미터를 받아서 처리해. -->
    <form th:action="@{/products}" method="get" style="display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap;">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명 검색"
               style="flex:1; min-width:200px; padding:10px 14px; border:1px solid #D8D2C0; border-radius:6px; font-size:13px;">
        <select name="category" style="padding:10px 14px; border:1px solid #D8D2C0; border-radius:6px; font-size:13px;">
            <option value="" th:selected="${selectedCategory == null or selectedCategory == ''}">전체 카테고리</option>
            <!-- categories 는 컨트롤러가 넘겨주는 ["완제품","재료","키트"] 고정 목록 -->
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                    th:selected="${c == selectedCategory}"></option>
        </select>
        <button type="submit" style="background:#233420; color:#f4f1e8; border:none; border-radius:6px; padding:10px 22px; font-size:13px; cursor:pointer;">검색</button>
        <a th:if="${keyword != null or selectedCategory != null}" th:href="@{/products}"
           style="align-self:center; font-size:12px; color:#7a8371; text-decoration:none;">필터 초기화</a>
    </form>

    <p style="font-size:13px; color:#7a8371; margin-bottom:16px;">
        총 <span th:text="${#lists.size(products)}">0</span>개 상품
    </p>

    <div th:if="${#lists.isEmpty(products)}" style="padding: 60px 0; text-align:center; color:#7a8371;">
        검색 조건에 맞는 상품이 없습니다.
    </div>

    <!-- ===== 상품 카드 그리드 ===== -->
    <div class="product-grid" style="padding:0 0 60px;">
        <div class="product-card" th:each="product : ${products}">
            <a th:href="@{'/products/' + ${product.id}}">
                <div class="thumb">
                    <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="">
                </div>
                <div class="name" th:text="${product.name}">상품명</div>
                <div style="font-size:11px; color:#8b9382; margin-bottom:4px;" th:text="${product.category}">카테고리</div>
                <!-- product.studio.name : 상품 엔티티에서 연결된 Studio 엔티티의 이름을
                     "점(.)으로 이어서" 바로 꺼내 쓸 수 있음 (JPA 지연로딩이라 이 화면을 그릴 때 실제 조회됨) -->
                <div style="font-size:11px; color:#7FAE72; margin-bottom:4px;" th:text="${product.studio.name}">공방명</div>
                <div class="price" th:text="'₩ ' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">0원</div>
            </a>
            <!-- 장바구니 담기 폼: 로그인한 사람에게만 버튼을 보여줌 (sec:authorize) -->
            <form th:action="@{/cart/add}" method="post" style="margin-top:8px;">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="hidden" name="quantity" value="1">
                <!-- redirectTo: 담은 뒤 어디로 돌아올지. 여기선 목록 페이지에 그대로 머무름 -->
                <input type="hidden" name="redirectTo" value="/products">
                <button type="submit" sec:authorize="isAuthenticated()"
                        style="width:100%; padding:8px 0; background:#F4F1E8; border:1px solid #D8D2C0; border-radius:6px; font-size:12px; cursor:pointer;">
                    장바구니 담기
                </button>
            </form>
            <!-- 로그인 안 한 사람에게는 버튼 대신 로그인 유도 링크를 보여줌 -->
            <a sec:authorize="isAnonymous()" th:href="@{/login}"
               style="display:block; text-align:center; margin-top:8px; padding:8px 0; background:#F4F1E8; border:1px solid #D8D2C0; border-radius:6px; font-size:12px; color:#5b6656; text-decoration:none;">
                로그인 후 담기
            </a>
        </div>
    </div>
</div>
</body>
</html>
