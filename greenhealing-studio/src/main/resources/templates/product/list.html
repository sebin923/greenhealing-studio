<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 - 그린힐링 스튜디오</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* ===== 쇼핑몰 카테고리 사이드바 + 상품 그리드 레이아웃 ===== */
        .shop-layout { display:flex; gap:36px; padding:36px 6% 60px; align-items:flex-start; }

        .cat-sidebar { width:220px; flex-shrink:0; }
        .cat-sidebar h3 { font-family:Georgia,serif; font-size:16px; margin-bottom:16px; }
        .cat-sidebar ul { list-style:none; margin:0; padding:0; }
        .cat-sidebar li { border-bottom:1px solid #EFEBDE; }
        .cat-sidebar a {
            display:flex; justify-content:space-between; padding:12px 4px;
            color:#4b5847; text-decoration:none; font-size:13px;
        }
        .cat-sidebar a:hover { color:#233420; }
        .cat-sidebar a.active { color:#233420; font-weight:bold; }
        .cat-sidebar .count { color:#a9b39f; font-size:12px; }

        .shop-main { flex:1; min-width:0; }
        .shop-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .shop-toolbar .total { font-size:13px; color:#7a8371; }
        .shop-toolbar .total b { color:#233420; }
        .search-box { display:flex; gap:8px; }
        .search-box input {
            flex:1; min-width:160px; padding:10px 14px; border:1px solid #D8D2C0; border-radius:6px; font-size:13px;
        }
        .search-box button {
            padding:10px 18px; background:#233420; color:#f4f1e8; border:none; border-radius:6px; font-size:12px; cursor:pointer;
        }

        /* ===== 페이지네이션 ===== */
        .pagination { display:flex; justify-content:center; gap:6px; margin-top:40px; flex-wrap:wrap; }
        .pagination a, .pagination span {
            display:inline-flex; align-items:center; justify-content:center;
            width:34px; height:34px; border-radius:6px; font-size:13px; text-decoration:none; color:#4b5847;
        }
        .pagination a:hover { background:#F4F1E8; }
        .pagination .current { background:#233420; color:#f4f1e8; font-weight:bold; }
        .pagination .disabled { color:#D8D2C0; }

        /* 화면이 좁아지면 사이드바가 위로 올라가면서 세로로 쌓임 */
        @media (max-width: 800px) {
            .shop-layout { flex-direction:column; }
            .cat-sidebar { width:100%; }
            .cat-sidebar ul { display:flex; flex-wrap:wrap; gap:0 18px; }
            .cat-sidebar li { border-bottom:none; }
        }
    </style>
</head>
<body style="padding:0;">
<nav th:replace="~{common/fragments :: nav(active='products')}"></nav>

<div class="shop-layout">
    <!-- ===== 왼쪽: 카테고리 사이드바 ===== -->
    <aside class="cat-sidebar">
        <h3>카테고리</h3>
        <ul>
            <li>
                <a th:href="@{/products}"
                   th:classappend="${selectedCategory == null or selectedCategory == ''} ? 'active' : ''">
                    <span>전체</span>
                    <span class="count" th:text="${totalCount}">0</span>
                </a>
            </li>
            <li th:each="c : ${categories}">
                <a th:href="@{/products(category=${c})}"
                   th:classappend="${c == selectedCategory} ? 'active' : ''">
                    <span th:text="${c}">카테고리</span>
                    <span class="count" th:text="${categoryCounts.get(c)}">0</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== 오른쪽: 상품 그리드 ===== -->
    <div class="shop-main">
        <div class="shop-toolbar">
            <div class="total">
                <b th:text="${selectedCategory} ?: '전체'">전체</b> 상품
                <b th:text="${totalCount}">0</b>개
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <!-- 정렬 바꾸면 바로 그 정렬로 다시 조회됨 (검색어/카테고리는 그대로 유지) -->
                <select onchange="location.href=this.value" style="padding:10px 14px; border:1px solid #D8D2C0; border-radius:6px; font-size:13px;">
                    <option value="#" th:value="@{/products(category=${selectedCategory}, keyword=${keyword}, sort='latest')}"
                            th:selected="${sort == 'latest'}">최신순</option>
                    <option th:value="@{/products(category=${selectedCategory}, keyword=${keyword}, sort='price-asc')}"
                            th:selected="${sort == 'price-asc'}">가격 낮은순</option>
                    <option th:value="@{/products(category=${selectedCategory}, keyword=${keyword}, sort='likes')}"
                            th:selected="${sort == 'likes'}">찜 많은순</option>
                </select>
                <form class="search-box" th:action="@{/products}" method="get">
                    <input type="hidden" name="category" th:value="${selectedCategory}">
                    <input type="hidden" name="sort" th:value="${sort}">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명 검색">
                    <button type="submit">검색</button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" style="padding: 60px 0; text-align:center; color:#7a8371;">
            상품이 없습니다.
        </div>

        <div class="product-grid" style="padding:0;">
            <div class="product-card" th:each="product : ${products}" style="position:relative;">
                <!-- 찜 버튼: 카드 전체를 감싸는 링크 밖에 별도로 둬서, 찜 누를 때 상세페이지로 안 넘어가게 함 -->
                <form sec:authorize="isAuthenticated()" th:action="@{'/products/' + ${product.id} + '/like'}" method="post"
                      style="position:absolute; top:10px; right:10px; z-index:2;">
                    <input type="hidden" name="redirectTo" value="/products">
                    <button type="submit" th:text="${likedProductIds.contains(product.id)} ? '♥' : '♡'"
                            th:style="${likedProductIds.contains(product.id)} ? 'color:#D9506B;' : 'color:#fff;'"
                            style="background:rgba(35,52,32,0.35); border:none; border-radius:50%; width:30px; height:30px; font-size:15px; cursor:pointer;">♡</button>
                </form>
                <a th:href="@{'/products/' + ${product.id}}">
                    <div class="thumb">
                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="">
                    </div>
                    <div style="font-size:11px; color:#7FAE72; margin-bottom:2px;" th:text="${product.studio.name}">공방명</div>
                    <div class="name" th:text="${product.name}">상품명</div>
                    <div class="price" th:text="'₩ ' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">0원</div>
                </a>
                <form th:action="@{/cart/add}" method="post" style="margin-top:8px;">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="hidden" name="quantity" value="1">
                    <input type="hidden" name="redirectTo" value="/products">
                    <button type="submit" sec:authorize="isAuthenticated()"
                            style="width:100%; padding:8px 0; background:#F4F1E8; color:#233420; border:1px solid #D8D2C0; border-radius:6px; font-size:12px; cursor:pointer;">
                        장바구니 담기
                    </button>
                </form>
                <a sec:authorize="isAnonymous()" th:href="@{/login}"
                   style="display:block; text-align:center; margin-top:8px; padding:8px 0; background:#F4F1E8; border:1px solid #D8D2C0; border-radius:6px; font-size:12px; color:#5b6656; text-decoration:none;">
                    로그인 후 담기
                </a>
            </div>
        </div>

        <!-- ===== 페이지네이션: 1 2 3 4 5 ... 식으로 페이지 번호 나열 =====
             totalPages(전체 페이지 수)만큼 반복문을 돌리기 위해 #numbers.sequence(0, totalPages-1) 사용 -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" th:href="@{/products(category=${selectedCategory}, keyword=${keyword}, page=${currentPage - 1})}">‹</a>
            <span th:if="${currentPage == 0}" class="disabled">‹</span>

            <th:block th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                <span th:if="${p == currentPage}" class="current" th:text="${p + 1}">1</span>
                <a th:if="${p != currentPage}" th:href="@{/products(category=${selectedCategory}, keyword=${keyword}, page=${p})}" th:text="${p + 1}">1</a>
            </th:block>

            <a th:if="${currentPage < totalPages - 1}" th:href="@{/products(category=${selectedCategory}, keyword=${keyword}, page=${currentPage + 1})}">›</a>
            <span th:if="${currentPage == totalPages - 1}" class="disabled">›</span>
        </div>
    </div>
</div>
<footer th:replace="~{common/fragments :: footer}"></footer>
</body>
</html>
