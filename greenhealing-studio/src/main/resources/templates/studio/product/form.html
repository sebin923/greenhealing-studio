<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록/수정 - 공방 관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .admin-shell { display:flex; }
        .admin-side { width:220px; background:#233420; color:#f4f1e8; min-height:100vh; padding:34px 0; }
        .admin-side .logo { font-family:Georgia,serif; font-size:16px; padding:0 28px 30px; }
        .admin-side .item { display:block; padding:14px 28px; font-size:13px; color:#cfd9c8; text-decoration:none; }
        .admin-side .item.on { background:#3a5230; color:#fff; font-weight:bold; }
        .admin-main { flex:1; padding:36px 40px; }
        .form-wrap { }
        .form-wrap h1 { font-family:Georgia,serif; font-size:22px; margin-bottom:28px; }
        .field { margin-bottom:18px; }
        .field label { display:block; font-size:12px; color:#5b6656; margin-bottom:8px; }
        .field input, .field select, .field textarea {
            width:100%; padding:12px 14px; border:1px solid #D8D2C0; border-radius:6px; font-size:13px;
        }
        .field textarea { resize:vertical; }
        .submit-btn { width:100%; background:#233420; color:#f4f1e8; border:none; padding:15px 0;
            border-radius:8px; font-size:14px; cursor:pointer; margin-top:10px; }
        .cancel-link { display:block; text-align:center; margin-top:16px; font-size:13px; color:#7a8371; text-decoration:none; }
    </style>
</head>
<body style="padding:0;">
<div class="admin-shell">
    <div class="admin-side">
        <div class="logo">GREEN HEALING<br>공방 관리자</div>
        <a class="item" th:href="@{/studio-admin/info}">공방 정보</a>
        <a class="item on" th:href="@{/studio-admin/products}">상품 관리</a>
        <a class="item " th:href="@{/studio-admin/classes}">클래스 관리</a>
        <a class="item" th:href="@{/studio-admin/orders}">주문 관리</a>
        <a class="item" th:href="@{/studio-admin/custom-orders}">주문제작 관리</a>
        <a class="item" th:href="@{/studio-admin}">← 관리자 홈</a>
        <a class="item" th:href="@{/logout}" style="margin-top:20px; border-top:1px solid rgba(244,241,232,.15); padding-top:20px;">로그아웃</a>
    </div>
    <div class="admin-main">
        <div class="form-wrap" style="max-width:560px; margin:0; padding:0;">
            <!-- product가 null이면 신규 등록, 값이 있으면 수정 모드. formAction/submitLabel은 컨트롤러가 상황에 맞게 미리 계산해서 넘겨줌 -->
            <h1 th:text="${product != null} ? '상품 수정' : '상품 등록'">상품 등록</h1>

            <!-- th:action="@{${formAction}}" : formAction 변수(문자열)를 그대로 URL로 사용함 -->
            <form th:action="@{${formAction}}" method="post">
                <div class="field">
                    <label>상품명</label>
                    <input type="text" name="name" th:value="${product?.name}" required>
                </div>
                <div class="field">
                    <label>카테고리</label>
                    <select name="category" required>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                                th:selected="${product != null and product.category == c}"></option>
                    </select>
                </div>
                <div class="field">
                    <label>가격 (원)</label>
                    <input type="number" name="price" th:value="${product?.price}" min="0" required>
                </div>
                <div class="field">
                    <label>재고 (개)</label>
                    <input type="number" name="stock" th:value="${product?.stock}" min="0" required>
                </div>
                <div class="field">
                    <label>상품 설명</label>
                    <textarea name="description" rows="4" th:text="${product?.description}"></textarea>
                </div>
                <div class="field">
                    <label>이미지 경로 (선택, 예: /images/products/xxx.jpg)</label>
                    <input type="text" name="imageUrl" th:value="${product?.imageUrl}">
                </div>

                <button type="submit" class="submit-btn" th:text="${submitLabel}">등록하기</button>
            </form>
            <a class="cancel-link" th:href="@{/studio-admin/products}">← 취소하고 목록으로</a>
        </div>
    </div>
</div>
</body>
</html>
