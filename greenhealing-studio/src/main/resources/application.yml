spring:
  application:
    name: greenhealing-studio

  datasource:
    # 로컬 MySQL 기준. 실제 비밀번호는 절대 커밋하지 말고
    # 환경변수(DB_PASSWORD)나 별도 application-local.yml(.gitignore 처리)로 관리하세요.
    url: jdbc:mysql://localhost:3306/greenhealing_studio?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:0923}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발 초기에는 update로 시작하고, 스키마가 안정되면 validate로 전환 권장
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false

  mail:
    # Gmail 기준 예시. 구글 계정 > 보안 > 2단계 인증 활성화 후
    # '앱 비밀번호'를 발급받아 MAIL_PASSWORD로 사용하세요. (일반 로그인 비밀번호 아님)
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_USERNAME:your-email@gmail.com}
  base-url: http://localhost:8080

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug